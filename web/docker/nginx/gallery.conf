# Addition to the serversideup nginx server (included from /etc/nginx/server-opts.d/).

# Library files go out through nginx, not PHP: MediaController checks the login and
# answers with an empty body and X-Accel-Redirect: /_gallery_media/<path>; nginx
# serves the file from the read-only library mount. internal — not reachable from
# outside. ^~ is required: otherwise the image's regex location for static files
# (*.webp, *.mp4) catches the internal redirect and nginx loops back to index.php.
location ^~ /_gallery_media/ {
    internal;
    alias /photos/;
    sendfile on;
    tcp_nopush on;
    aio threads;
    output_buffers 4 256k;
}

# Vite build: hashed names — cache for a long time.
location ^~ /build/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
}
