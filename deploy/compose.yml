# Family gallery — Dokploy stack (type Compose, source Raw), project family-gallery.
#
#   indexer  workers image: indexes on start, every INDEX_INTERVAL, and within a minute
#            or so of new files settling in Imports. No domain, no ports — the Android app
#            reads the results straight from the SMB share \\10.20.1.100\Photos.
#   web      Laravel + Inertia web app, domain photos.home.internal (set in Dokploy →
#            Domains: service web, port 8080, HTTPS off). Login with roles; the library
#            is the indexer's catalog, read-only. Accounts, sessions and favourites: SQLite in
#            /srv/family-gallery/web (1000:3000), dumped by the nightly backup.
#            First admin: docker exec … php artisan gallery:user <email>
#
# Stack Environment in Dokploy: APP_KEY (secret, `php artisan key:generate --show`),
# WORKERS_TAG / WEB_TAG (latest or sha-… to roll back), optionally TZ.
#
# Host data: /srv/family-gallery/photos on the system SSD (originals in YYYY/MM, Imports/,
# .gallery/). The homelab Samba stage creates it (2775 lenar:media) along with the share;
# create_host_path: false keeps a typo here from silently starting on an empty library.

services:
  indexer:
    image: ghcr.io/kamabyte/family-gallery-workers:${WORKERS_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    init: true                          # reaps ffmpeg children, forwards SIGTERM
    stop_grace_period: 60s              # an interrupted run never publishes; let it unwind
    # 1000:3000 = lenar:media — same owner/group as files arriving through the Photos share.
    user: "1000:3000"
    environment:
      TZ: ${TZ:-Europe/Moscow}          # EXIF has no zone — read in this local time
      IMPORT_SETTLE: ${IMPORT_SETTLE:-300}
      INDEX_INTERVAL: ${INDEX_INTERVAL:-21600}
      # os.cpu_count() ignores the CPU limit below, so the worker count is explicit.
      WORKERS: ${WORKERS:-2}
    volumes:
      # Read-write: ingest moves files out of Imports and the indexer writes .gallery/.
      - type: bind
        source: /srv/family-gallery/photos
        target: /photos
        bind: { create_host_path: false }
    deploy:
      resources:
        limits:
          cpus: "2"                     # 4 cores shared with Jellyfin; it runs niced too
          memory: 4g                    # ~1.5 GiB per worker + ffmpeg

  web:
    image: ghcr.io/kamabyte/family-gallery-web:${WEB_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      APP_NAME: Фотографии
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?задайте APP_KEY во вкладке Environment стека}
      APP_URL: http://photos.home.internal
      APP_LOCALE: ru
      APP_TIMEZONE: ${TZ:-Europe/Moscow}
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
      # Sessions in the database: a password reset by an admin logs that person out.
      SESSION_DRIVER: database
      SESSION_LIFETIME: "43200"           # 30 days — it's a family photo album
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      # The indexer's published catalog; thumbnails and originals go out through nginx
      # (web/docker/nginx/gallery.conf) after the login check.
      GALLERY_DRIVER: catalog
      GALLERY_ROOT: /photos
      GALLERY_ACCEL_REDIRECT: /_gallery_media
      # Migrations, config/route/view caches at start (serversideup automation).
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION_ISOLATION: "false"
    volumes:
      - type: bind
        source: /srv/family-gallery/web
        target: /data
        bind: { create_host_path: false }
      # The library — only read: the web app never changes photos or the catalog.
      - type: bind
        source: /srv/family-gallery/photos
        target: /photos
        read_only: true
        bind: { create_host_path: false }
    expose:
      - "8080"                          # domain port in Dokploy; no ports: — Traefik only
    networks: [default, dokploy-network]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

networks:
  dokploy-network:
    external: true
